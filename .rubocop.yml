inherit_from:
  - .rubocop_todo.yml

plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - gemfiles/**/*
    - bin/**/*

Gemspec/DevelopmentDependencies:
  Enabled: false

Style/Documentation:
  Enabled: false
