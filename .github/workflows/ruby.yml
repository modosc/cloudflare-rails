# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["rails-7.2", "rails-8.0", "rails-8.1", "rails-edge"]
        rack_attack:
          [
            "without_rack_attack",
            "with_rack_attack_first",
            "with_rack_attack_last",
          ]
        include:
          - rails: "rails-edge"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}

    env:
      MATRIX_RUBY: ${{ matrix.ruby }}
      MATRIX_RAILS: ${{ matrix.rails }}
      MATRIX_RACK_ATTACK: ${{ matrix.rack_attack }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ matrix.ruby }}-${{matrix.rails}}-${{ hashFiles('**/cloudflare-rails.gemspec') }}
          restore-keys: |
            ${{ runner.os }}-gems-${{ matrix.ruby }}-${{matrix.rails}}-
            ${{ runner.os }}-gems-${{ matrix.ruby }}-
            ${{ runner.os }}-gems-
      - name: Bundle install
        run: |
          bundle install --jobs 4 --retry 3
      - name: Appraisal install
        run: |
          bundle exec appraisal "$MATRIX_RAILS" bundle install
      - name: Run tests
        run: |
          bundle exec appraisal "$MATRIX_RAILS" rake "$MATRIX_RACK_ATTACK"

  tests:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix status
        if: ${{ needs.test.result != 'success' }}
        run: exit 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0" # Not needed with a .ruby-version file
          bundler-cache: true
      - uses: actions/cache@v3
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('cloudflare-rails.gemspec') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - name: Bundle install
        run: |
          bundle install --jobs 4 --retry 3
      - name: Rubocop
        run: bundle exec rubocop --format github
